<div class="login-container">
  <div class="login-card">
    <h1>AdFlow</h1>
    <h2>Welcome</h2>
    <p>Login with your Facebook account to continue</p>
    
    <button 
      class="facebook-login-btn" 
      (click)="loginWithFacebook()"
      [disabled]="loading">
      <span *ngIf="!loading">Login with Facebook</span>
      <span *ngIf="loading">Loading...</span>
    </button>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>
  </div>
</div>
